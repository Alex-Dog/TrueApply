# Developer-side AI configuration.
#
# Users pick a provider and model in Settings → AI; ai.provider and ai.<id>.model are only
# the defaults until they do. The model menu itself lives in AiProviders.
# Each provider needs an AiProvider implementation registered in
# com.trueapply.ai.AiProviders. Keys come from the named environment variable first,
# then from what the user saved in Settings.
ai.provider=anthropic

ai.anthropic.model=claude-opus-5-5
ai.anthropic.apiKeyEnv=ANTHROPIC_API_KEY

ai.openai.model=gpt-5.5
ai.openai.apiKeyEnv=OPENAI_API_KEY
